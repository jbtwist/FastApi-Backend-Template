[project]
name = "backend"
version = "0.1.0"
description = "Reusable FastAPI JWT-auth backend template"
authors = [
    { name = "Juan Villarejo", email = "jbtwist92@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "boto3>=1.43.78",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "fastapi-redis-sdk>=0.8.0",
    "greenlet>=3.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.7",
    "pyjwt[crypto]>=2.9",
    "redis>=8.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.24",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.3",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
