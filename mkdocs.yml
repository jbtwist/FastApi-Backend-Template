site_name: todoapp
site_description: Todo application docs
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - With the API: getting-started/index.md
      - In the web client: getting-started/web-client.md
  - Guides:
      - Overview: guides/index.md
      - Add a Language: guides/add-a-language.md
      - Theming: guides/theming.md
  - API Reference:
      - reference/index.md
      - Auth (Backend): reference/auth.md
      - Password Policy: reference/password_policy.md
      - Mail: reference/mail.md
  - Architecture:
      - Overview: architecture/overview.md
      - Decisions:
          - architecture/decisions/index.md
          - 1. Refresh token rotation: architecture/decisions/0001-refresh-token-rotation-with-family-reuse-detection.md
          - 2. Dual token delivery: architecture/decisions/0002-dual-cookie-and-body-token-delivery.md
          - 3. Durable email outbox: architecture/decisions/0003-durable-email-outbox-before-dispatch.md
          - 4. Email verification via frontend: architecture/decisions/0004-email-verification-via-frontend.md
          - 5. Frontend owns auth error copy: architecture/decisions/0005-frontend-owns-auth-error-copy.md
