# Local stack in the real three-process shape: api, worker, beat from one image,
# plus the backing services. Knobs worth experimenting with are shell-overridable:
#
#   docker compose up --build
#   docker compose up -d --scale api=3 --scale worker=3
#   RATE_LIMIT_ENABLED=false PASSWORD_CHECK_PWNED=false docker compose up -d
#   PG_MAX_CONNECTIONS=40 DB_POOL_SIZE=10 docker compose up -d --scale api=4

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/backend_template
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  REDIS_URL: redis://redis:6379
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  API_BASE_URL: http://localhost:8000
  FRONTEND_BASE_URL: http://localhost:8081
  CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
  JWT_SECRET: dev-only-secret-not-for-any-deployed-environment
  COOKIE_SECURE: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  FROM_EMAIL: no-reply@backend-template.local
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Both default to production behaviour. Turn them off for a load test: an
  # enforced limiter measures the limiter, and the breach check is an outbound
  # call to api.pwnedpasswords.com in the register/reset path.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  PASSWORD_CHECK_PWNED: ${PASSWORD_CHECK_PWNED:-true}

x-backend-image: &backend-image
  build:
    context: ./backend
  image: backend-template:local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    # Lower max_connections to watch the pool ceiling bite on scale-out.
    command: postgres -c max_connections=${PG_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_template
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Runs once and exits. api, worker and beat wait for it to succeed, so the
  # schema is in place before anything serves, and N api replicas never race
  # each other running migrations on startup.
  migrate:
    build:
      context: ./backend
    image: backend-template:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-image
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      # Local only: trusts X-Forwarded-For from anyone. In a real deployment
      # name the load balancer's address instead.
      - --forwarded-allow-ips
      - "*"
    environment:
      <<: *backend-env
    # No host port, so `--scale api=N` can't collide. Reach it through nginx.
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *backend-image
    command:
      - celery
      - -A
      - backend.mail.celery_app
      - worker
      - --loglevel
      - INFO
      - --concurrency
      - ${CELERY_CONCURRENCY:-4}
    environment:
      <<: *backend-env
    restart: unless-stopped

  # Exactly one replica, always. Two beats means two schedules, so every
  # sweep_pending_emails fires twice and stale outbox rows get dispatched twice.
  beat:
    <<: *backend-image
    command:
      - celery
      - -A
      - backend.mail.celery_app
      - beat
      - --loglevel
      - INFO
      # /app is root-owned and the container runs as uid 10001, so beat's
      # schedule file has to live somewhere writable.
      - --schedule
      - /tmp/celerybeat-schedule
    environment:
      <<: *backend-env
    restart: unless-stopped
    scale: 1

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
