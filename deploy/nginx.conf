# Single stable entrypoint in front of the api replicas.
#
# Docker's embedded DNS (127.0.0.11) returns one address per lookup, rotating
# across the running api containers. Putting the upstream in a variable forces
# nginx to resolve per request instead of caching at startup, which is what
# lets `--scale api=N` take effect without restarting this proxy.

events {}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  # `request_time` is the number pool sizing is calculated from: `get_db` keeps a
  # transaction open for the whole request, so a request's duration is also how
  # long it held a Postgres connection. `upstream_time` separates the app's own
  # share from time spent reading the request or writing the response.
  #
  # `upstream_addr` is which replica served the request, so a scale-out can be
  # confirmed rather than assumed:
  #   docker compose logs --no-log-prefix nginx | jq -r .upstream_addr | sort | uniq -c
  #
  # JSON so percentiles are one command:
  #   docker compose logs --no-log-prefix nginx \
  #     | jq -s 'map(.request_time|tonumber) | sort | .[(length*0.95)|floor]'
  log_format timed escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
    '"status":$status,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","upstream_addr":"$upstream_addr",'
    '"bytes":$body_bytes_sent}';

  access_log /dev/stdout timed;
  error_log  /dev/stderr warn;

  server {
    listen 8000;

    location / {
      set $backend http://api:8000;
      proxy_pass $backend;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
    }
  }
}
