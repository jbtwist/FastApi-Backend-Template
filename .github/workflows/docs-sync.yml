name: Docs sync after merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    if: >
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'docs/update-after-')
    runs-on: ubuntu-latest
    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run docs skill
        uses: google-github-actions/run-gemini-cli@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            PR #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}")
            was just merged into main. Do the following steps in order.

            1. Inspect exactly what changed with
               `git show --stat ${{ github.event.pull_request.merge_commit_sha }}`
               and then
               `git diff ${{ github.event.pull_request.merge_commit_sha }}^ ${{ github.event.pull_request.merge_commit_sha }}`.
               (`gh` has no credentials here — use `git`.) This is the only
               part of the codebase you need to read closely; don't go
               exploring beyond what's needed to describe this diff
               accurately.

            2. Read `.claude/skills/docs/SKILL.md` in full, in particular
               section 12 ("Post-merge guardrails") — it governs this run
               specifically. Its rules below are non-negotiable, not
               suggestions to weigh:

               - You may only create or edit files under `docs/`, entries in
                 `mkdocs.yml`'s `nav`, the glossary at
                 `.claude/skills/docs/GLOSSARY.md` (never create a GLOSSARY.md
                 anywhere else, including the repo root), Python docstrings,
                 or TSDoc comments (`/** */`) in `.ts`/`.tsx` files. Never
                 touch application logic, tests, or CI/workflow files
                 yourself — but this is only a restriction on which files
                 YOU may edit, not a reason to skip documenting. If the diff
                 changes a logic file by adding/changing a public endpoint,
                 function, or workflow, that's a real behavior change: write
                 about it in `docs/` or a docstring, just don't touch the
                 logic file itself. Example: a new `/version` endpoint added
                 in `main.py` needs a line in the architecture overview or a
                 reference page, even though `main.py` is off-limits to edit.
               - Only skip entirely (no file changes, no branch, no PR) when
                 the diff itself has no observable behavior difference for a
                 user or developer — e.g. it's CI config, tooling,
                 permissions, dependency bumps, or a pure refactor. Do not
                 invent a doc/glossary entry just to have something to show
                 for the run, but do not use "it's in a logic/CI file" alone
                 as the reason to skip — check whether the change is
                 observable first.

            3. If step 2 concluded a real update IS needed: create a new
               branch named exactly `docs/update-after-${{ github.event.pull_request.number }}`,
               make the doc changes, then run:
               `git add -A && git commit -m "docs: sync after #${{ github.event.pull_request.number }}"`
               and `git push -u origin HEAD`.

               Do NOT run `gh` — it has no credentials in this environment.
               A later workflow step opens the pull request from the branch
               you push. Your job is done once the branch is pushed. A run
               that edits files but doesn't push the branch has not completed
               the task, because the runner and its file changes are
               discarded the moment the job ends.

      - name: Open docs PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="docs/update-after-${{ github.event.pull_request.number }}"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            gh pr create --base main --head "$BR" \
              --title "docs: sync after #${{ github.event.pull_request.number }}" \
              --body "Automated docs update following #${{ github.event.pull_request.number }}." \
              || echo "PR already exists or could not be created"
          else
            echo "No $BR branch was pushed — docs skill decided no update was needed."
          fi
